<style>
:root{--bg-0:#070c18;--bg-1:#0b1326;--bg-2:#0f1b35;--ink:#f3f6fc;--ink-soft:#aab6cc;--ink-faint:#6c7a96;--teal:#2ee6c5;--gold:#f0c061;--red:#ff6f6f;--line:rgba(255,255,255,.08);}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Satoshi',sans-serif;color:var(--ink);
background:radial-gradient(1200px 700px at 82% -6%, rgba(46,230,197,.10), transparent 60%),radial-gradient(1000px 800px at -8% 30%, rgba(90,167,255,.07), transparent 55%),linear-gradient(160deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2));}
.gate{width:min(440px,90vw);text-align:center;}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,var(--teal),#5aa7ff);position:relative;box-shadow:0 0 30px rgba(46,230,197,.4);margin:0 auto 22px;}
.logo::after{content:"";position:absolute;inset:12px;border-radius:50%;border:2.5px solid var(--bg-0);}
.brand{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:26px;}
h1{font-family:'Clash Display',sans-serif;font-weight:600;font-size:30px;letter-spacing:-.01em;margin-bottom:10px;}
p{color:var(--ink-faint);font-size:15px;margin-bottom:28px;}
form{display:flex;gap:10px;}
input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:15px;outline:none;}
input:focus{border-color:rgba(46,230,197,.5);}
button{background:linear-gradient(140deg,var(--teal),#25c9ab);color:#04221c;border:none;border-radius:12px;padding:14px 22px;font-weight:700;font-size:15px;cursor:pointer;font-family:'Satoshi',sans-serif;}
button:hover{filter:brightness(1.08);}
.err{color:var(--red);font-size:14px;margin-top:14px;min-height:20px;font-family:'JetBrains Mono',monospace;}
.foot{margin-top:34px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;}
.foot b{color:var(--gold);font-weight:500;}
.spin{display:none;margin-top:14px;color:var(--teal);font-family:'JetBrains Mono',monospace;font-size:13px;}
</style>
</head>

function b64(s){const b=atob(s);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function tryUnlock(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(META.salt),iterations:META.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(META.iv)},key,b64(CT));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  document.getElementById("spin").style.display="block";
  document.getElementById("err").textContent="";
  try{
    const html=await tryUnlock(pw);
    if(remember)sessionStorage.setItem("ns_pw",pw);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("spin").style.display="none";
    document.getElementById("err").textContent="Incorrect password.";
    sessionStorage.removeItem("ns_pw");
  }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();go(document.getElementById("pw").value,true);});
const saved=sessionStorage.getItem("ns_pw");
if(saved)go(saved,false);
